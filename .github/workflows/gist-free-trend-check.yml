name: Gist free Ghana trend check

on:
  schedule:
    # Offset from the hour to reduce GitHub's top-of-hour scheduling congestion.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gist-free-trend-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Collect Ghana search and YouTube candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 gist/tools/free_trend_check.py --output gist/trend-candidates.json
      - name: Publish changed candidate report
        run: |
          git add gist/trend-candidates.json
          if git diff --cached --quiet; then
            echo "Candidate list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Gist Ghana trend candidates"
          git push
